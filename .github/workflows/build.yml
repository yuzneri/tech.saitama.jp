name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hugo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.7"
          extended: true
      - run: hugo build --panicOnWarning
